name: Deploy to VPS

# NÃO dispara direto no push: espera o workflow CI terminar em main e só segue
# se ele passou. Antes disto o deploy ia para produção sem nada rodar teste —
# foi assim que 27 falhas se acumularam sem ninguém ver.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -euo pipefail
            source ~/.zshrc 2>/dev/null || true
            export PATH="$HOME/.rbenv/bin:$HOME/.rbenv/shims:$PATH"
            cd /home/brpl/code/prc_legal_data

            echo "--- Pulling latest code ---"
            git fetch origin
            git reset --hard origin/main

            # Sem isto o REVISION fica congelado no último deploy manual e o
            # /api/v1/version passa a reportar um commit que não é o que está
            # rodando. Mesmo carimbo do infra/deploy.sh — manter os dois iguais.
            echo "--- Stamping REVISION ---"
            printf '{"commit":"%s","branch":"%s","deployed_at":"%s"}\n' \
              "$(git rev-parse --short HEAD)" \
              "main" \
              "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > REVISION
            cat REVISION

            echo "--- Installing dependencies ---"
            bundle install --deployment --without development test

            echo "--- Running migrations ---"
            RAILS_ENV=production bin/rails db:migrate

            # Solid Queue roda dentro do Puma (plugin gateado por SOLID_QUEUE_IN_PUMA).
            grep -q '^SOLID_QUEUE_IN_PUMA=' .env || echo 'SOLID_QUEUE_IN_PUMA=1' >> .env

            # db:migrate não carrega db/queue_schema.rb — carga manual, só no primeiro deploy.
            if ! RAILS_ENV=production bin/rails runner 'ActiveRecord::Base.connection.table_exists?(:solid_queue_jobs) or exit 1' >/dev/null 2>&1; then
              echo "--- Loading Solid Queue schema (first deploy) ---"
              # O check de ambiente protegido barra schema:load em produção; o
              # queue_schema.rb só cria tabelas solid_queue_*, é seguro.
              DISABLE_DATABASE_ENVIRONMENT_CHECK=1 RAILS_ENV=production bin/rails db:schema:load:queue
            fi

            echo "--- Restarting app ---"
            sudo systemctl restart legal_data_api

            sleep 10
            sudo systemctl is-active legal_data_api && echo "Deploy successful — legal_data_api is running"
